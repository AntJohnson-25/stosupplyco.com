<style>
:root{
  --bg:#141414; --surface:#1c1c1c; --surface-2:#242424; --line:#2c2c2c;
  --ink:#f2efe9; --ink-2:#cfc9bd; --muted:#8a8378;
  --maroon:#7a1f2b; --maroon-lt:#a83244;
  --r:10px; --font:"MS Sans Serif","Tahoma","Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:13px;line-height:1.6;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea,select{font-family:inherit;font-size:13px;color:inherit;background:none}
a{color:var(--maroon-lt)}
[hidden]{display:none!important}

/* Three tracks, not two. The feed is a fixed 480px flanked by equal 1fr
   gutters, so it sits dead-centre in the viewport; the profile widget lives in
   the left gutter and is pinned to its start edge rather than riding along with
   the centring. The feed is capped rather than 1fr because a 1fr feed stretched
   the post card to ~920px while its gallery is 420px, leaving a band of dead
   card beside every image. */
.page{
  margin:0;padding:22px 18px 60px;
  display:grid;gap:18px;
  grid-template-columns:1fr minmax(0,480px) 1fr;
  grid-template-areas:"profile main game";
  align-items:start;
}
.profile-col{grid-area:profile;justify-self:start;width:220px;
  display:flex;flex-direction:column;gap:18px;position:sticky;top:22px}
/* Mirrors the profile column on the opposite gutter: pinned to its edge, and
   sticky so it stays put while the feed scrolls past it. */
/* min() so it shrinks with the gutter on a narrow desktop instead of
   overflowing it — the track is 1fr and will not hold a fixed 300px. */
.game-col{grid-area:game;justify-self:end;width:min(300px,100%);position:sticky;top:22px;padding:12px}
main{grid-area:main;display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ── profile ─────────────────────────────────────────────── */
#profile{padding:12px}
/* Full width of the card. The mark is a 4.8:1 wordmark, so capping it the way
   the old squarish lockup was capped left a thin, apologetic strip. */
#profile .logo{display:block;width:100%;height:auto;margin:2px auto 12px}
#profile .name{font-size:15px;font-weight:700;color:var(--ink);margin-top:9px}
#profile .role{color:var(--muted);margin-top:1px}
#profile .bio{color:var(--ink-2);margin-top:8px;line-height:1.55;font-size:12px}
#profileFooter{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px}
#profileFooter button, #profileFooter a{
  text-align:left;background:none;border:0;color:var(--ink-2);cursor:pointer;
  padding:2px 0;font-size:12px}
#profileFooter button:hover, #profileFooter a:hover{color:var(--ink)}
#whoami{font-size:11px;color:var(--muted);margin-top:2px}

/* ── carousel (profile shot + post galleries share this) ───── */
.carousel{
  position:relative;width:100%;aspect-ratio:1;border-radius:var(--r);
  overflow:hidden;border:1px solid var(--line);background:#000;
}
.carousel .track{display:flex;height:100%;width:100%;transition:transform .35s ease}
.carousel .slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
.carousel .slide img,.carousel .slide video{width:100%;height:100%;object-fit:cover;display:block}
.carousel .slide iframe{width:100%;height:100%;border:0}

.carousel .nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(0,0,0,.45);color:#fff;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.carousel .nav:hover{background:rgba(0,0,0,.7)}
.carousel .nav.prev{left:8px}
.carousel .nav.next{right:8px}

.carousel .dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.carousel .dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;cursor:pointer;background:rgba(255,255,255,.4)}
.carousel .dots button[aria-current="true"]{background:var(--maroon-lt)}

/* ── feed / post cards ──────────────────────────────────────── */
.post{padding:14px}
.post .head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.post .head .author{font-weight:700}
.post .head .when{color:var(--muted);font-size:11px}
.post .head .draft-tag{margin-left:auto;font-size:10px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--maroon-lt);border:1px solid var(--maroon-lt);
  border-radius:4px;padding:1px 6px}
.post .caption{white-space:pre-wrap;color:var(--ink-2);margin-bottom:10px;cursor:pointer}
.post .caption:hover{color:var(--ink)}
/* Author-only controls. Muted until hovered so they never compete with the
   post itself, and pushed right so they cannot be hit by accident. */
.post .head .owner{margin-left:auto;display:flex;gap:10px;align-items:baseline}
.post .head .draft-tag + .owner{margin-left:10px}
.post .head .owner button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px;padding:0}
.post .head .owner button:hover{color:var(--maroon-lt)}
.post .gallery{margin:0 auto 10px;max-width:100%}
.post .gallery .carousel{aspect-ratio:4/5}

.reactbar{display:flex;align-items:center;gap:14px;padding-top:6px;border-top:1px solid var(--line)}
.reactbar .react{background:none;border:0;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;gap:5px;padding:4px 2px;font-size:12px}
.reactbar .react:hover{color:var(--ink)}
.reactbar .react[aria-pressed="true"]{color:var(--maroon-lt);font-weight:700}
.reactbar .spacer{flex:1}
.reactbar .link-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px}
.reactbar .link-btn:hover{color:var(--ink)}

.comments{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.comments .c{margin-bottom:8px;font-size:12px}
.comments .c .cname{font-weight:700;margin-right:6px}
.comments .c .cwhen{color:var(--muted);font-size:10px}
.comments .cbody{color:var(--ink-2)}
.comments form{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.comments input,.comments textarea{background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;color:var(--ink)}
.comments textarea{resize:vertical;min-height:50px}
.comments .row{display:flex;gap:6px}
.comments .row input{flex:1}

.btn{background:var(--maroon);border:0;color:#fff;border-radius:6px;padding:6px 14px;
  cursor:pointer;font-weight:700}
.btn:hover{background:var(--maroon-lt)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}

.empty{padding:24px;text-align:center;color:var(--muted)}
.hint{font-size:11px;color:var(--muted)}
.err{color:#e08a8a;font-size:12px;margin-top:4px}

/* ── auth panel ─────────────────────────────────────────────── */
#authPanel{padding:14px}
#authPanel form{display:flex;flex-direction:column;gap:8px;max-width:280px}
#authPanel input{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;color:var(--ink)}

/* ── composer ────────────────────────────────────────────────── */
#composer{padding:14px}
#composer .field{margin-bottom:12px}
#composer label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);margin-bottom:5px}
#composer textarea,#composer input[type=text]{width:100%;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink)}
#composer textarea{resize:vertical;min-height:70px}
#assetList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.asset-thumb{position:relative;width:70px;height:70px;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);background:#000}
.asset-thumb img,.asset-thumb video{width:100%;height:100%;object-fit:cover}
.asset-thumb .fb{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--muted);font-size:10px;text-align:center;padding:4px}
.asset-thumb .rm{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.7);color:#fff;
  border:0;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;line-height:1}
.asset-thumb .uploading{position:absolute;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
#composer .actions{display:flex;gap:8px;align-items:center;margin-top:14px}

/* ── dashboard ───────────────────────────────────────────────── */
#dashboard{padding:14px}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 16px;min-width:100px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
table.data{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
table.data th{text-align:left;color:var(--muted);font-weight:400;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-bottom:1px solid var(--line)}
table.data td{padding:5px 8px;border-bottom:1px solid var(--line)}
.dash-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  margin:14px 0 6px}

/* ── range mini-game ─────────────────────────────────────────── */
.game-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.game-head .g-title{font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.game-head .g-right{display:flex;align-items:center;gap:8px}
.game-head .g-best{font-size:11px;color:var(--muted)}
.game-head .g-best b{color:var(--ink-2)}
.g-mute{background:none;border:0;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.65}
.g-mute:hover{opacity:1}
.g-mute[aria-pressed="true"]{opacity:.4}

/* touch-action:none so a tap on the range fires a shot instead of starting a
   scroll, and so a quick double-tap does not zoom the page. */
.game-stage{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:#101010;touch-action:none;user-select:none}
/* The reticle replaces the pointer, so the real one has to go. */
.game-stage.armed{cursor:none}
.game-stage canvas{display:block;width:100%;height:100%}

/* Drawn, not an image file — it scales crisply and costs no request. */
.reticle{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;
  pointer-events:none;opacity:0;transition:opacity .12s ease}
.game-stage.armed .reticle{opacity:1}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--maroon-lt);
  box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.reticle::before{left:50%;top:0;width:1px;height:100%;margin-left:-.5px}
.reticle::after{top:50%;left:0;height:1px;width:100%;margin-top:-.5px}
.reticle .ring{position:absolute;inset:9px;border:1px solid var(--maroon-lt);border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.reticle .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
  border-radius:50%;background:var(--maroon-lt)}
.reticle.recoil{animation:recoil .13s ease-out}
@keyframes recoil{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}

.game-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;
  background:rgba(10,10,10,.82);cursor:default}
.game-overlay .g-msg{font-weight:700;font-size:15px}
.game-overlay .g-sub{font-size:11px;color:var(--muted);line-height:1.5}
.game-overlay .btn{margin-top:6px;padding:5px 16px;font-size:12px}

.game-hud{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.game-hud b{color:var(--ink);font-weight:700}
.game-hud .hot b{color:var(--maroon-lt)}

/* ── confirm dialog ──────────────────────────────────────────── */
/* Deleting a post is irreversible and cascades to its comments and
   reactions, so it gets a real confirmation rather than window.confirm. */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;z-index:500;padding:20px}
#modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;max-width:360px;width:100%}
#modal h3{font-size:14px;margin-bottom:6px}
#modal p{color:var(--ink-2);font-size:12px;margin-bottom:14px;line-height:1.5}
#modal .row{display:flex;gap:8px;justify-content:flex-end}

/* ── profile editor ──────────────────────────────────────────── */
#profileEdit{padding:14px}
#profileEdit .slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#profileEdit .slot{position:relative;width:86px;height:86px;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);background:#000}
#profileEdit .slot img,#profileEdit .slot video{width:100%;height:100%;object-fit:cover}
#profileEdit .slot .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;
  border:0;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1}
#profileEdit .slot .mv{position:absolute;bottom:2px;background:rgba(0,0,0,.7);color:#fff;border:0;
  width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;border-radius:3px}
#profileEdit .slot .mv.l{left:2px}
#profileEdit .slot .mv.r{left:24px}
#profileEdit .uploading{position:absolute;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}

/* ── toast ───────────────────────────────────────────────────── */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(50px);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  padding:9px 16px;border-radius:8px;font-size:12px;opacity:0;transition:all .25s ease;
  pointer-events:none;z-index:400}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Below this the gutters cannot hold a playable range — at 900px the third
   track squeezes the panel to ~128px — so the whole thing stacks instead. The
   game goes under the profile rather than at the very bottom, where nobody
   would scroll past an endless feed to find it. */
@media (max-width:1000px){
  .page{grid-template-columns:minmax(0,520px);grid-template-areas:"profile" "game" "main";
    justify-content:center}
  .profile-col{position:static;width:220px;justify-self:center}
  .game-col{position:static;width:100%;max-width:320px;justify-self:center}
}

@media (max-width:640px){
  .page{grid-template-columns:minmax(0,1fr)}
  /* The profile card turns horizontal so it does not eat the whole first screen */
  .profile-col{width:100%;flex-direction:row;align-items:flex-start;gap:12px}
  .carousel{width:110px;flex-shrink:0}
  #profile{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;width:100%}
  #profileFooter{width:100%}
}
</style>
</head>
<body>
<div class="page">

  <div class="profile-col">
    <aside class="box" id="profile">
      <picture>
        <source srcset="assets/sto-logo.webp" type="image/webp"/>
        <img class="logo" src="assets/sto-logo.png" alt="STO Supply Co" width="1200" height="249"/>
      </picture>
      <div class="carousel" id="profileCarousel">
        <div class="track">
          <div class="slide"><img src="assets/sto-01.jpg" alt="STO Supply Co"/></div>
          <div class="slide"><img src="assets/sto-02.jpg" alt="STO Supply Co"/></div>
        </div>
      </div>
      <h1 class="name">STO Supply Co</h1>
      <div class="role">Daddy, Life Saver, Springfield Armory Lover</div>
      <div class="bio">Cleveland, OH · 2A Advocate</div>
      <div id="profileFooter">
        <a href="/" id="feedLink">Feed</a>
        <button id="composeBtn" hidden>New post</button>
        <button id="profileEditBtn" hidden>Edit profile images</button>
        <button id="dashboardBtn" hidden>Dashboard</button>
        <button id="signInBtn">Sign in</button>
        <button id="signOutBtn" hidden>Sign out</button>
        <div id="whoami"></div>
      </div>
    </aside>
  </div>

  <!-- The feed is fetched from Supabase and rendered client-side, so a crawler
       that does not execute JavaScript would otherwise find an empty page.
       This is replaced the moment the app paints. -->
  <main id="main"><noscript>
    <div class="box" style="padding:14px">
      <h2 style="font-size:15px;margin-bottom:8px">Second Amendment culture from Cleveland, Ohio</h2>
      <p style="color:var(--ink-2);line-height:1.6">
        STO Supply Co is a Northeast Ohio firearms and 2A community — range days, gear talk,
        training notes and Second Amendment advocacy from Black gun owners in Cleveland.
        Turn on JavaScript to read the feed.
      </p>
    </div>
  </noscript></main>

  <aside class="box game-col" id="gamePanel" aria-label="Bullseye mini game">
    <div class="game-head">
      <span class="g-title">The Range</span>
      <span class="g-right">
        <button id="gMute" class="g-mute" type="button" aria-pressed="false" title="Mute the bullseye bell">🔊</button>
        <span class="g-best">Best <b id="gBest">0</b></span>
      </span>
    </div>
    <div class="game-stage" id="gStage">
      <canvas id="gCanvas"></canvas>
      <div class="reticle" id="gReticle"><span class="ring"></span><span class="dot"></span></div>
      <div class="game-overlay" id="gOverlay">
        <div class="g-msg" id="gMsg">Pop-Up Range</div>
        <div class="g-sub" id="gSub">30 seconds. Drop them before they drop.<br>Far ones pay triple, vitals pay most.</div>
        <button class="btn" id="gStart">Start</button>
      </div>
    </div>
    <div class="game-hud">
      <span>Score <b id="gScore">0</b></span>
      <span id="gComboWrap">Combo <b id="gCombo">x1</b></span>
      <span>Time <b id="gTime">30</b></span>
    </div>
  </aside>

</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ── carousel factory — used for the profile shot and every post gallery ── */
function initCarousel(root, autoplay){
  const track  = root.querySelector('.track');
  const slides = Array.from(track.children);
  if (slides.length === 0) return;

  if (slides.length > 1){
    const prev = document.createElement('button');
    prev.className = 'nav prev'; prev.setAttribute('aria-label','Previous'); prev.innerHTML = '&#8249;';
    const next = document.createElement('button');
    next.className = 'nav next'; next.setAttribute('aria-label','Next'); next.innerHTML = '&#8250;';
    const dotsWrap = document.createElement('div');
    dotsWrap.className = 'dots';
    slides.forEach((_, idx) => {
      const b = document.createElement('button');
      b.setAttribute('aria-label', 'Go to slide ' + (idx + 1));
      b.addEventListener('click', (e) => { e.stopPropagation(); go(idx); });
      dotsWrap.appendChild(b);
    });
    prev.addEventListener('click', (e) => { e.stopPropagation(); go(i - 1); });
    next.addEventListener('click', (e) => { e.stopPropagation(); go(i + 1); });
    root.appendChild(prev); root.appendChild(next); root.appendChild(dotsWrap);
  }
  const dots = root.querySelectorAll('.dots button');
  let i = 0, timer = null;
  // The profile carousel is re-rendered whenever its images are edited, so a
  // previous autoplay timer on this root has to be cleared or they accumulate.
  if (root._carouselTimer) clearInterval(root._carouselTimer);

  function render(){
    track.style.transform = 'translateX(-' + (i * 100) + '%)';
    dots.forEach((d, idx) => d.setAttribute('aria-current', idx === i ? 'true' : 'false'));
  }
  function go(n){ i = (n + slides.length) % slides.length; render(); restart(); }
  function restart(){
    if (timer) clearInterval(timer);
    if (autoplay && slides.length > 1) timer = setInterval(() => go(i + 1), 4000);
    root._carouselTimer = timer;
  }
  render(); restart();
}
initCarousel(document.getElementById('profileCarousel'), true);

/* The slides shipped in the HTML are the fallback: they render instantly and
   are what visitors see if the site_settings row has never been written (or if
   Supabase is unreachable). Captured before anything replaces them. */
const DEFAULT_PROFILE_MEDIA = Array.from(
  document.querySelectorAll('#profileCarousel .slide img')
).map(img => ({ kind: 'photo', url: img.getAttribute('src'), alt: img.alt || '' }));

/* ── range mini-game: pop-up deer ────────────────────────────────────
   An outdoor silhouette range in the right gutter. Entirely self-contained:
   no Supabase, no routing, it never touches the feed, and it sits above the
   config guard so it still runs on a site whose backend is not wired up.

   Steel deer rise from behind cover in three depth lanes, stand for a moment,
   then drop back down. Hit one and it is knocked flat. The far lane is smaller
   and pays triple, the vital ring pays most, consecutive hits build a
   multiplier, and both the standing time and the gap between pop-ups shorten
   as you score — so the difficulty is set by how well you are already doing,
   which is what makes it worth another go.                                  */
(function rangeGame(){
  const panel   = document.getElementById('gamePanel');
  const stage   = document.getElementById('gStage');
  const canvas  = document.getElementById('gCanvas');
  const reticle = document.getElementById('gReticle');
  const overlay = document.getElementById('gOverlay');
  if (!panel || !canvas) return;
  const ctx = canvas.getContext('2d');

  const ROUND_MS  = 30000;
  const UP_START  = 1500;   // ms a deer stands before dropping
  const UP_MIN    = 640;
  const UP_STEP   = 34;     // shaved off per hit
  const GAP_START = 900;    // ms between pop-ups
  const GAP_MIN   = 380;
  const GAP_STEP  = 24;
  const MAX_UP    = 3;      // deer on the range at once
  const RISE_MS   = 190;    // how long the rise/drop animation takes

  // Depth lanes: ground line as a fraction of height, silhouette scale, and
  // payout. Further away is smaller and harder, so it pays more.
  // Sized so even the far deer's vital ring is ~9px across on a 274px stage.
  // Any smaller and the triple payout stops being a challenge and starts being
  // a lottery.
  const LANES = [
    { gy: 0.68, scale: 0.42, mult: 3 },
    { gy: 0.77, scale: 0.55, mult: 2 },
    { gy: 0.90, scale: 0.72, mult: 1 },
  ];

  const css = getComputedStyle(document.documentElement);
  const COL = {
    cream:  css.getPropertyValue('--ink').trim()       || '#f2efe9',
    bright: css.getPropertyValue('--maroon-lt').trim() || '#a83244',
    muted:  css.getPropertyValue('--muted').trim()     || '#8a8378',
  };

  /* A vital hit rings a bell. Synthesised rather than an audio file so it costs
     no request and cannot fail to load. The context is built lazily on the
     first shot — browsers refuse to start audio before a user gesture. */
  let audio = null, muted = false;
  try { muted = localStorage.getItem('sto_range_muted') === '1'; } catch(e){}

  function ding(){
    if (muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const out = audio.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.20, t + 0.006);
      out.gain.exponentialRampToValueAtTime(0.0001, t + 0.40);
      out.connect(audio.destination);
      // Two partials (E6 + B6) — one sine alone sounds like a microwave.
      [[1318.5, 1], [1975.5, 0.34]].forEach(([hz, level]) => {
        const osc = audio.createOscillator(), g = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(hz, t);
        g.gain.value = level;
        osc.connect(g); g.connect(out);
        osc.start(t); osc.stop(t + 0.42);
      });
    } catch(e){}
  }

  let W = 0, H = 0, dpr = 1, scene = null;
  let mode = 'idle';                 // idle | playing | over
  let deer = [], holes = [], pops = [];
  let score = 0, combo = 0, hits = 0, best = 0, roundEnd = 0, nextPop = 0, raf = null;

  try { best = Number(localStorage.getItem('sto_range_best')) || 0; } catch(e){}
  document.getElementById('gBest').textContent = best;

  /* ── the scene ─────────────────────────────────────────────────────────
     Sky, ridge, treeline and ground never change, so they are rendered once
     into an offscreen canvas and blitted each frame. Seeded randomness keeps
     the same hills and trees across a resize instead of reshuffling them. */
  function rng(seed){ return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

  function buildScene(){
    const c = document.createElement('canvas');
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rand = rng(20230607);

    const sky = g.createLinearGradient(0, 0, 0, H * 0.72);
    sky.addColorStop(0,    '#101725');
    sky.addColorStop(0.50, '#33304a');
    sky.addColorStop(0.80, '#7d5442');
    sky.addColorStop(1,    '#c0834f');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    const sun = g.createRadialGradient(W * 0.70, H * 0.58, 2, W * 0.70, H * 0.58, H * 0.30);
    sun.addColorStop(0,    'rgba(255,216,155,.90)');
    sun.addColorStop(0.22, 'rgba(232,148,84,.45)');
    sun.addColorStop(1,    'rgba(232,148,84,0)');
    g.fillStyle = sun; g.fillRect(0, 0, W, H);

    // Far ridge: one soft wave of hills.
    g.fillStyle = '#2b2c3a';
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 6){
      g.lineTo(x, H * 0.575 - Math.sin(x / (W * 0.38) * Math.PI * 2) * H * 0.022
                            - rand() * H * 0.006);
    }
    g.lineTo(W, H); g.closePath(); g.fill();

    // Treeline: pines of varying height along the horizon.
    g.fillStyle = '#141d18';
    for (let x = -6; x < W + 10; x += 5 + rand() * 5){
      // Tall enough to tower over the far lane's deer. Trees shorter than the
      // quarry read as scrub and flatten the depth the lanes are selling.
      const th = H * (0.11 + rand() * 0.09), base = H * 0.625, hw = th * 0.34;
      g.beginPath();
      g.moveTo(x, base); g.lineTo(x + hw, base - th); g.lineTo(x + hw * 2, base);
      g.closePath(); g.fill();
    }
    g.fillRect(0, H * 0.615, W, H * 0.03);

    const ground = g.createLinearGradient(0, H * 0.60, 0, H);
    ground.addColorStop(0, '#333a27');
    ground.addColorStop(1, '#14170f');
    g.fillStyle = ground; g.fillRect(0, H * 0.635, W, H * 0.365);
    return c;
  }

  /* Grass the deer stand behind. Drawn over each lane's ground line so the
     clip edge the deer rises through never shows as a hard cut. */
  function cover(g, gy, scale, seed, toBottom){
    const rand = rng(seed);
    g.fillStyle = '#1a2214';
    // Only a band, except for the nearest lane. Filling to the bottom on every
    // lane would paint flat green over the scene's receding ground gradient.
    g.fillRect(0, gy, W, toBottom ? H - gy : Math.max(5, 9 * scale));
    g.beginPath();
    for (let x = -4; x < W + 6; x += 3 + rand() * 3){
      const th = (6 + rand() * 12) * scale;
      g.moveTo(x, gy + 2);
      g.lineTo(x + 1.6 * scale + 0.8, gy - th);
      g.lineTo(x + 3.4 * scale + 1.6, gy + 2);
    }
    g.fill();
  }

  /* ── the deer ──────────────────────────────────────────────────────────
     Drawn in a unit space 120 wide and 116 tall with the hooves at y=0 and
     the antler tips at y=-116, so one path serves every lane at any scale. */
  function drawDeer(g, d){
    g.save();
    g.translate(d.x, d.gy);
    if (d.knock) {              // knocked-down plate: pivots on its base
      g.translate(0, -2 * d.scale);
      g.rotate(d.knock * 1.35);
      g.translate(0, 2 * d.scale);
    }
    g.translate(0, d.drop);
    g.scale(d.scale, d.scale);

    g.fillStyle = d.flash > 0 ? '#7a5c3a' : '#1d1712';
    g.strokeStyle = g.fillStyle;
    g.lineJoin = 'round'; g.lineCap = 'round';

    // legs
    [[34, 40], [46, 52], [76, 82], [88, 94]].forEach(([x0, x1]) => {
      g.fillRect(x0, -48, x1 - x0, 48);
    });
    // body, chest and rump as overlapping ellipses
    g.beginPath();
    g.ellipse(64, -60, 32, 18, 0, 0, Math.PI * 2);
    g.ellipse(46, -58, 17, 16, 0, 0, Math.PI * 2);
    g.ellipse(86, -60, 17, 17, 0, 0, Math.PI * 2);
    g.fill();
    // neck
    g.beginPath();
    g.moveTo(42, -66); g.lineTo(30, -92); g.lineTo(20, -90); g.lineTo(36, -56);
    g.closePath(); g.fill();
    // head and muzzle
    g.beginPath();
    g.ellipse(21, -93, 13, 6.5, -0.38, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.moveTo(14, -96); g.lineTo(3, -92); g.lineTo(6, -86); g.lineTo(16, -88);
    g.closePath(); g.fill();
    // ear
    g.beginPath();
    g.moveTo(26, -98); g.lineTo(33, -107); g.lineTo(29, -94);
    g.closePath(); g.fill();
    // antlers
    g.lineWidth = 3.4;
    g.beginPath();
    g.moveTo(24, -99); g.lineTo(20, -112); g.lineTo(13, -116);
    g.moveTo(21.4, -107); g.lineTo(12, -110);
    g.moveTo(23, -103); g.lineTo(15, -104);
    g.moveTo(26, -99); g.lineTo(31, -110); g.lineTo(38, -113);
    g.moveTo(29.2, -105); g.lineTo(37, -107);
    g.stroke();
    // tail
    g.beginPath();
    g.moveTo(100, -70); g.lineTo(108, -66); g.lineTo(100, -60);
    g.closePath(); g.fill();

    // Rim light along the top edge so it reads as a steel plate catching the
    // last of the sun rather than a flat hole in the scene.
    g.strokeStyle = 'rgba(226,178,120,.5)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(42, -72); g.lineTo(56, -76);
    g.moveTo(60, -77); g.lineTo(84, -74);
    g.stroke();

    // vital ring, faintly marked as it would be on a scoring plate
    g.strokeStyle = d.flash > 0 ? 'rgba(255,220,180,.85)' : 'rgba(190,160,130,.30)';
    g.lineWidth = 2;
    g.beginPath(); g.arc(54, -64, 11, 0, Math.PI * 2); g.stroke();

    g.restore();
  }

  // Hit zones in the same unit space. Ordered best-first.
  function zoneAt(ux, uy){
    if (Math.hypot(ux - 54, uy + 64) <= 11)  return { pts: 10, key: 'vital', label: 'VITAL' };
    if (Math.hypot(ux - 21, uy + 93) <= 15)  return { pts: 8,  key: 'head',  label: 'HEAD' };
    if (Math.hypot((ux - 66) / 36, (uy + 60) / 21) <= 1) return { pts: 5, key: 'body', label: 'HIT' };
    if (ux >= 30 && ux <= 96 && uy >= -50 && uy <= 2)    return { pts: 2, key: 'leg',  label: 'LOW' };
    return null;
  }

  function resize(){
    const r = stage.getBoundingClientRect();
    if (!r.width) return;
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scene = buildScene();
    draw();
  }

  function multiplier(){ return Math.min(1 + Math.floor(combo / 4), 5); }

  function popUp(){
    const li = Math.floor(Math.random() * LANES.length);
    const lane = LANES[li];
    const scale = lane.scale * (H / 274);       // lanes were tuned at a 274px stage
    const margin = 60 * scale;
    let x, tries = 0;
    do {
      x = margin + Math.random() * (W - margin * 2);
      tries++;
    } while (tries < 10 && deer.some(o => o.lane === li && Math.abs(o.x - x) < 90 * scale));
    deer.push({
      lane: li, x, gy: H * lane.gy, scale, mult: lane.mult,
      born: performance.now(),
      up: Math.max(UP_MIN, UP_START - hits * UP_STEP),
      drop: 116 * scale, knock: 0, flash: 0, dead: false,
    });
  }

  function setHud(){
    document.getElementById('gScore').textContent = score;
    document.getElementById('gCombo').textContent = 'x' + multiplier();
    document.getElementById('gComboWrap').classList.toggle('hot', multiplier() > 1);
    document.getElementById('gTime').textContent =
      Math.max(0, Math.ceil((roundEnd - performance.now()) / 1000));
  }

  function draw(){
    if (!W || !scene) return;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(scene, 0, 0, W, H);

    // Two slow clouds, the only thing moving when the range is idle.
    ctx.fillStyle = 'rgba(198,168,178,.13)';
    for (let i = 0; i < 2; i++){
      const cw = W * (0.42 + i * 0.16);
      const cx = ((now / (26000 + i * 9000) + i * 0.55) % 1.4 - 0.2) * (W + cw) - cw / 2;
      const cy = H * (0.16 + i * 0.13);
      ctx.beginPath();
      ctx.ellipse(cx, cy, cw * 0.30, H * 0.030, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + cw * 0.16, cy - H * 0.014, cw * 0.20, H * 0.024, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Back to front, so a near deer overlaps a far one and each lane's grass
    // hides the edge its deer rises through.
    LANES.forEach((lane, i) => {
      const gy = H * lane.gy;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, gy); ctx.clip();
      deer.filter(d => d.lane === i).forEach(d => drawDeer(ctx, d));
      ctx.restore();
      cover(ctx, gy, (H / 274) * (0.5 + i * 0.35), 991 + i * 37, i === LANES.length - 1);
    });

    for (const h of holes){
      const age = (now - h.t) / 2200;
      if (age >= 1) continue;
      ctx.globalAlpha = 0.6 * (1 - age);
      ctx.fillStyle = '#0b0b09';
      ctx.beginPath(); ctx.arc(h.x, h.y, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const p of pops){
      const age = (now - p.t) / 700;
      if (age >= 1) continue;
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = p.good ? COL.cream : COL.muted;
      ctx.font = '700 ' + (p.good ? 12 : 10.5) + 'px ' + css.getPropertyValue('--font');
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y - age * 18);
      ctx.globalAlpha = 1;
    }
  }

  function tick(){
    if (mode !== 'playing'){ raf = null; draw(); return; }
    const now = performance.now();
    if (now >= roundEnd){ endRound(); return; }

    for (const d of deer){
      const age = now - d.born;
      if (d.flash > 0) d.flash -= 16;
      if (d.dead){
        d.knock = Math.min(1, d.knock + 0.16);        // fall flat, then clear
      } else if (age < RISE_MS){
        d.drop = 116 * d.scale * (1 - age / RISE_MS); // rising
      } else if (age < RISE_MS + d.up){
        d.drop = 0;                                   // standing
      } else {
        const t = (age - RISE_MS - d.up) / RISE_MS;
        d.drop = 116 * d.scale * Math.min(1, t);      // dropping back
        if (t >= 1){ d.gone = true; combo = 0; }      // it got away
      }
    }
    deer = deer.filter(d => !d.gone && !(d.dead && d.knock >= 1));

    const standing = deer.filter(d => !d.dead).length;
    if (now >= nextPop && standing < MAX_UP){
      popUp();
      nextPop = now + Math.max(GAP_MIN, GAP_START - hits * GAP_STEP) * (0.75 + Math.random() * 0.5);
    }

    setHud();
    draw();
    raf = requestAnimationFrame(tick);
  }

  function shoot(e){
    if (mode !== 'playing') return;
    // Stops a touch from also producing an emulated mouse event, which would
    // otherwise fire this twice and burn a shot.
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;

    reticle.classList.remove('recoil');
    void reticle.offsetWidth;
    reticle.classList.add('recoil');

    holes.push({ x, y, t: performance.now() });
    if (holes.length > 12) holes.shift();

    // Nearest lane first: a near deer drawn over a far one should take the hit.
    const live = deer.filter(d => !d.dead && d.drop < 8).sort((a, b) => b.lane - a.lane);
    for (const d of live){
      const ux = (x - d.x) / d.scale;
      const uy = (y - (d.gy + d.drop)) / d.scale;
      const z = zoneAt(ux, uy);
      if (!z) continue;
      const gained = z.pts * d.mult * multiplier();
      score += gained; combo++; hits++;
      d.dead = true; d.flash = 90;
      if (z.key === 'vital') ding();
      pops.push({ x, y: d.gy + d.drop - 40 * d.scale, t: performance.now(),
                  text: z.label + ' +' + gained, good: true });
      if (pops.length > 6) pops.shift();
      setHud();
      return;
    }
    combo = 0;
    pops.push({ x, y, t: performance.now(), text: 'miss', good: false });
    setHud();
  }

  function start(){
    score = 0; combo = 0; hits = 0; deer = []; holes = []; pops = [];
    mode = 'playing';
    roundEnd = performance.now() + ROUND_MS;
    nextPop = 0;
    overlay.hidden = true;
    stage.classList.add('armed');
    resize();
    setHud();
    // Always cancel-and-reschedule. Guarding on `if (!raf)` looks equivalent
    // but is not: a backgrounded tab never fires its pending frame, so `raf`
    // keeps a handle that will never resolve and the loop could never restart.
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function endRound(){
    mode = 'over';
    deer = [];
    if (raf){ cancelAnimationFrame(raf); raf = null; }
    stage.classList.remove('armed');
    if (score > best){
      best = score;
      try { localStorage.setItem('sto_range_best', String(best)); } catch(e){}
      document.getElementById('gBest').textContent = best;
    }
    document.getElementById('gMsg').textContent = score + ' points';
    document.getElementById('gSub').innerHTML =
      (score >= best && score > 0 ? 'New best.' : 'Best ' + best + '.')
      + '<br>' + hits + ' deer down in 30 seconds.';
    document.getElementById('gStart').textContent = 'Again';
    overlay.hidden = false;
    document.getElementById('gTime').textContent = '0';
    draw();
  }

  function aim(e){
    const r = stage.getBoundingClientRect();
    reticle.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  }
  stage.addEventListener('pointermove', aim);
  // A tap produces no pointermove, so the reticle is placed on the way down —
  // otherwise it would sit wherever the last shot landed.
  stage.addEventListener('pointerdown', (e) => { aim(e); stage.classList.add('armed'); shoot(e); });
  document.getElementById('gStart').addEventListener('click', start);

  const muteBtn = document.getElementById('gMute');
  function paintMute(){
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.title = muted ? 'Unmute the vital-hit bell' : 'Mute the vital-hit bell';
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('sto_range_muted', muted ? '1' : '0'); } catch(e){}
    paintMute();
    if (!muted) ding();
  });
  paintMute();

  // Leaving the stage mid-round would strand the reticle, and a round running
  // in a hidden tab just burns the clock.
  stage.addEventListener('pointerleave', () => { if (mode === 'playing') stage.classList.remove('armed'); });
  stage.addEventListener('pointerenter', () => { if (mode === 'playing') stage.classList.add('armed'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') endRound(); });

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

/* ── guard: config.js must be filled in ─────────────────────────────── */
const CONFIGURED = typeof window.SUPABASE_URL === 'string' && window.SUPABASE_URL.startsWith('http')
                 && typeof window.SUPABASE_ANON_KEY === 'string' && window.SUPABASE_ANON_KEY.length > 20;
if (!CONFIGURED){
  document.getElementById('main').innerHTML =
    '<div class="box empty">Supabase is not configured — check config.js.</div>';
  return;
}
const supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

/* ── visitor/session ids ─────────────────────────────────────────────── */
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function visitorId(){
  try {
    let v = localStorage.getItem('sto_visitor');
    if (!v){ v = uuid(); localStorage.setItem('sto_visitor', v); }
    return v;
  } catch(e){ return uuid(); }
}
function sessionId(){
  try {
    let s = sessionStorage.getItem('sto_session');
    if (!s){ s = uuid(); sessionStorage.setItem('sto_session', s); }
    return s;
  } catch(e){ return uuid(); }
}
function deviceType(){
  const w = window.innerWidth;
  return w < 640 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop';
}

/* ── small utils ─────────────────────────────────────────────────────── */
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function timeAgo(iso){
  const d = new Date(iso), s = Math.floor((Date.now() - d.getTime())/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 2592000) return Math.floor(s/86400) + 'd ago';
  return d.toLocaleDateString();
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const REACTIONS = [
  { kind: 'like',    label: '👍' },
  { kind: 'fire',    label: '🔥' },
  { kind: 'hundred', label: '💯' },
];

const MEDIA_BUCKET = 'post-media';

/* Resolves to true only if the user actually confirms. Escape and the backdrop
   both count as "no", so a stray click can never delete a post. */
function confirmDialog(title, body, okLabel){
  return new Promise(resolve => {
    const root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div id="modal"><div class="sheet" role="dialog" aria-modal="true">'
      + '<h3>' + escapeHtml(title) + '</h3>'
      + '<p>' + escapeHtml(body) + '</p>'
      + '<div class="row">'
        + '<button class="btn ghost" data-no>Cancel</button>'
        + '<button class="btn" data-yes>' + escapeHtml(okLabel || 'Confirm') + '</button>'
      + '</div></div></div>';

    function close(answer){
      root.innerHTML = '';
      document.removeEventListener('keydown', onKey);
      resolve(answer);
    }
    function onKey(e){ if (e.key === 'Escape') close(false); }

    root.querySelector('[data-yes]').addEventListener('click', () => close(true));
    root.querySelector('[data-no]').addEventListener('click', () => close(false));
    root.querySelector('#modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') close(false);
    });
    document.addEventListener('keydown', onKey);
    root.querySelector('[data-no]').focus();
  });
}

/* A public storage URL looks like …/object/public/<bucket>/<path>. Only files
   that really live in our bucket are returned — a Facebook embed or any other
   external link yields null and is left alone. */
function storagePathFromUrl(url){
  const marker = '/object/public/' + MEDIA_BUCKET + '/';
  const i = String(url || '').indexOf(marker);
  if (i === -1) return null;
  try { return decodeURIComponent(String(url).slice(i + marker.length).split('?')[0]) || null; }
  catch(e){ return null; }
}

/* ── auth state ──────────────────────────────────────────────────────── */
let session  = null;
let isAuthor = false;
let myReactions = {}; // postId -> Set(kind) reacted locally this session

async function refreshAuthorStatus(){
  isAuthor = false;
  if (!session) return;
  const { data, error } = await supa.from('authors').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (error){ isAuthor = false; return; }
  isAuthor = !!data;
}

async function checkSession(){
  const { data } = await supa.auth.getSession();
  session = data.session || null;
  await refreshAuthorStatus();
  paintAuthUI();
}

function paintAuthUI(){
  document.getElementById('composeBtn').hidden     = !isAuthor;
  document.getElementById('profileEditBtn').hidden = !isAuthor;
  document.getElementById('dashboardBtn').hidden   = !isAuthor;
  document.getElementById('signInBtn').hidden    = !!session;
  document.getElementById('signOutBtn').hidden   = !session;
  document.getElementById('whoami').textContent  = session
    ? (isAuthor ? session.user.email : session.user.email + ' (not an author)')
    : '';
}

document.getElementById('signInBtn').addEventListener('click', () => navigate('/signin'));
document.getElementById('signOutBtn').addEventListener('click', async () => {
  await supa.auth.signOut();
  session = null; isAuthor = false;
  paintAuthUI();
  navigate('/');
});
document.getElementById('composeBtn').addEventListener('click', () => navigate('/compose'));
document.getElementById('profileEditBtn').addEventListener('click', () => navigate('/profile-images'));
document.getElementById('dashboardBtn').addEventListener('click', () => navigate('/dashboard'));
document.getElementById('feedLink').addEventListener('click', (e) => { e.preventDefault(); navigate('/'); });

/* ── data access ─────────────────────────────────────────────────────── */
async function listPosts(includeDrafts){
  const { data, error } = await supa.rpc('list_posts', { include_drafts: !!includeDrafts });
  if (error){ toast('Could not load posts: ' + error.message); return []; }
  return data || [];
}
async function getPost(slug){
  const { data, error } = await supa.rpc('get_post', { p_slug: slug });
  if (error){ toast('Could not load post: ' + error.message); return null; }
  return data;
}
async function toggleReaction(postId, kind){
  const { data, error } = await supa.rpc('toggle_reaction', {
    p_post_id: postId, p_visitor_id: visitorId(), p_kind: kind
  });
  if (error){ toast('Reaction failed: ' + error.message); return null; }
  return data;
}
async function addComment(postId, name, body){
  const { data, error } = await supa.rpc('add_comment', {
    p_post_id: postId, p_name: name, p_body: body, p_visitor_id: visitorId()
  });
  if (error){ toast(error.message || 'Comment failed'); return null; }
  return data;
}
/* Deleting the post row cascades to its assets, comments, reactions and
   events (see the foreign keys in schema.sql). What does NOT cascade is the
   uploaded file behind each asset, so those are removed first — otherwise
   every deleted post leaves its photos sitting in the storage quota forever.
   The file sweep is best-effort: if it fails, the post still goes. */
async function deletePost(postId, assets){
  const paths = (assets || []).map(a => storagePathFromUrl(a.url)).filter(Boolean);
  if (paths.length){
    const { error } = await supa.storage.from(MEDIA_BUCKET).remove(paths);
    if (error) console.warn('post media not removed:', error.message);
  }
  const { error } = await supa.from('posts').delete().eq('id', postId);
  if (error){ toast('Delete failed: ' + error.message); return false; }
  toast('Post deleted');
  return true;
}

function trackEvent(postId, type){
  supa.rpc('track_event', {
    p_post_id: postId, p_visitor_id: visitorId(), p_session_id: sessionId(),
    p_type: type, p_referrer: document.referrer ? new URL(document.referrer).hostname : null,
    p_device: deviceType()
  }).then(()=>{}, ()=>{});
}

/* ── profile carousel (author-editable) ──────────────────────────────── */
const PROFILE_MEDIA_KEY = 'profile_carousel';
let profileMedia = DEFAULT_PROFILE_MEDIA.slice();

async function loadProfileMedia(){
  const { data, error } = await supa.from('site_settings')
    .select('value').eq('key', PROFILE_MEDIA_KEY).maybeSingle();
  // A missing table means site-settings.sql has not been run yet. That is not
  // worth shouting about on a visitor's screen — the shipped slides still show.
  if (error){ console.warn('profile media:', error.message); return; }
  const items = data && data.value && Array.isArray(data.value.items) ? data.value.items : null;
  if (items && items.length){
    profileMedia = items;
    renderProfileCarousel();
  }
}

async function saveProfileMedia(items){
  const { error } = await supa.from('site_settings')
    .upsert({ key: PROFILE_MEDIA_KEY, value: { items }, updated_at: new Date().toISOString() },
            { onConflict: 'key' });
  if (error){ toast('Could not save: ' + error.message); return false; }
  profileMedia = items;
  renderProfileCarousel();
  return true;
}

function profileSlideHtml(m){
  if (m.kind === 'video') return '<div class="slide"><video src="'+escapeHtml(m.url)+'" muted autoplay loop playsinline></video></div>';
  return '<div class="slide"><img src="'+escapeHtml(m.url)+'" alt="'+escapeHtml(m.alt||'STO Supply Co')+'"/></div>';
}

// Rebuilds the whole element: initCarousel appends its own arrows and dots, so
// re-running it over a used root would stack a second set on top.
function renderProfileCarousel(){
  const root = document.getElementById('profileCarousel');
  if (!root) return;
  const items = profileMedia.length ? profileMedia : DEFAULT_PROFILE_MEDIA;
  root.innerHTML = '<div class="track">' + items.map(profileSlideHtml).join('') + '</div>';
  initCarousel(root, true);
}

/* ── rendering ───────────────────────────────────────────────────────── */
const mainEl = document.getElementById('main');

// reactions: per-kind counts object (single-post view) or null (feed card,
// where list_posts only carries a combined total, not a per-kind split)
function reactBarHtml(postId, reactions){
  const btns = REACTIONS.map(r => {
    const pressed = myReactions[postId] && myReactions[postId].has(r.kind);
    const countHtml = reactions ? ' <span class="cnt">' + (reactions[r.kind]||0) + '</span>' : '';
    return '<button class="react" data-kind="'+r.kind+'" data-post="'+postId+'" '
         + 'aria-pressed="'+(pressed?'true':'false')+'">'
         + r.label + countHtml + '</button>';
  }).join('');
  return '<div class="reactbar">' + btns
       + '<span class="spacer"></span>'
       + '<button class="link-btn" data-share="' + postId + '">Share</button>'
       + '</div>';
}

function assetHtml(a){
  if (a.kind === 'photo') return '<div class="slide"><img src="'+escapeHtml(a.url)+'" alt="'+escapeHtml(a.alt||'')+'"/></div>';
  if (a.kind === 'video') return '<div class="slide"><video src="'+escapeHtml(a.url)+'" controls playsinline></video></div>';
  if (a.kind === 'facebook_embed'){
    const src = 'https://www.facebook.com/plugins/video.php?height=476&href='
              + encodeURIComponent(a.url) + '&show_text=false&width=267&t=0';
    return '<div class="slide"><iframe src="'+src+'" scrolling="no" frameborder="0" '
         + 'allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe></div>';
  }
  return '';
}
function galleryHtml(assets){
  if (!assets || !assets.length) return '';
  return '<div class="gallery"><div class="carousel"><div class="track">'
       + assets.map(assetHtml).join('') + '</div></div></div>';
}

// Rendered only for a signed-in author; a visitor never receives the markup,
// and the RLS delete policy is the real gate behind it either way.
function ownerControlsHtml(){
  return isAuthor ? '<span class="owner"><button data-delete>Delete</button></span>' : '';
}

function postCardHtml(p){
  return '<article class="box post" data-slug="'+escapeHtml(p.slug)+'" data-id="'+p.id+'">'
    + '<div class="head">'
      + '<span class="author">'+escapeHtml(p.author)+'</span>'
      + '<span class="when">'+timeAgo(p.published_at)+'</span>'
      + (p.status === 'draft' ? '<span class="draft-tag">Draft</span>' : '')
      + ownerControlsHtml()
    + '</div>'
    + '<div class="caption" data-open="'+escapeHtml(p.slug)+'">'+escapeHtml(p.caption)+'</div>'
    + galleryHtml(p.assets)
    + reactBarHtml(p.id, null)
    + '<div class="hint" data-open="'+escapeHtml(p.slug)+'" style="cursor:pointer;margin-top:6px">'
      + (p.reaction_count||0) + ' reaction' + (p.reaction_count===1?'':'s')
      + ' · ' + (p.comment_count||0) + ' comment' + (p.comment_count===1?'':'s')
      + ' · ' + (p.view_count||0) + ' view' + (p.view_count===1?'':'s')
    + '</div>'
  + '</article>';
}

// container is the .box.post <article> element (dataset.slug/id live there)
function wireReactButtons(container){
  container.querySelectorAll('.react').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.post, kind = btn.dataset.kind;
      btn.disabled = true;
      const res = await toggleReaction(postId, kind);
      btn.disabled = false;
      if (!res) return;
      myReactions[postId] = myReactions[postId] || new Set();
      if (res.added) myReactions[postId].add(kind); else myReactions[postId].delete(kind);
      // feed cards have no per-kind breakdown to redraw against — just
      // reflect the toggle's pressed state and move on.
      const hasCounts = !!container.querySelector('.reactbar .cnt');
      container.querySelector('.reactbar').outerHTML =
        reactBarHtml(postId, hasCounts ? res.reactions : null);
      wireReactButtons(container);
    });
  });
  const shareBtn = container.querySelector('[data-share]');
  if (shareBtn) shareBtn.onclick = () => doShare(container.dataset.slug, container.dataset.id);
}
function wireCard(el){
  el.querySelectorAll('[data-open]').forEach(n => {
    n.addEventListener('click', () => navigate('/p/' + n.dataset.open));
  });
  wireReactButtons(el);
  wireOwnerControls(el, null);
}

// `assets` is passed on the single-post view, where the gallery comes back in a
// separate field; on a feed card it is stashed on the element by viewFeed().
function wireOwnerControls(container, assets){
  const del = container.querySelector('[data-delete]');
  if (!del) return;
  del.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ok = await confirmDialog(
      'Delete this post?',
      'This removes the post, its photos, and every comment and reaction on it. It cannot be undone.',
      'Delete post');
    if (!ok) return;
    del.disabled = true;
    const gone = await deletePost(container.dataset.id, assets || container._assets);
    if (!gone){ del.disabled = false; return; }
    navigate('/');
  });
}
function doShare(slug, postId){
  const url = location.origin + '/p/' + slug;
  const done = () => { toast('Link copied'); trackEvent(postId, 'share'); };
  if (navigator.share){
    navigator.share({ url, title: 'STO Supply Co' }).then(done).catch(()=>{});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(url).then(done, () => toast(url));
  } else {
    toast(url);
  }
}

async function viewFeed(){
  mainEl.innerHTML = '<div class="box empty">Loading…</div>';
  const posts = await listPosts(isAuthor);
  if (!posts.length){
    mainEl.innerHTML = '<div class="box empty">No posts yet.</div>';
    return;
  }
  mainEl.innerHTML = posts.map(postCardHtml).join('');
  Array.from(mainEl.children).forEach((el, idx) => {
    const c = el.querySelector('.carousel');
    if (c) initCarousel(c, false);
    el._assets = posts[idx].assets;   // so a delete can sweep the storage files
    wireCard(el);
  });
}

async function viewSinglePost(slug){
  mainEl.innerHTML = '<div class="box empty">Loading…</div>';
  const data = await getPost(slug);
  if (!data || !data.post){
    mainEl.innerHTML = '<div class="box empty">Post not found. <a href="/" data-back>Back to feed</a></div>';
    mainEl.querySelector('[data-back]').addEventListener('click', (e)=>{e.preventDefault();navigate('/');});
    return;
  }
  const p = data.post;
  trackEvent(p.id, 'view');

  const commentsHtml = (data.comments||[]).map(c =>
    '<div class="c"><span class="cname">'+escapeHtml(c.name)+'</span>'
    + '<span class="cwhen">'+timeAgo(c.created_at)+'</span>'
    + '<div class="cbody">'+escapeHtml(c.body)+'</div></div>'
  ).join('') || '<div class="hint">No comments yet — be the first.</div>';

  mainEl.innerHTML =
    '<div class="hint"><a href="/" data-back>&larr; Back to feed</a></div>'
    + '<article class="box post" data-slug="'+escapeHtml(p.slug)+'" data-id="'+p.id+'">'
      + '<div class="head"><span class="author">'+escapeHtml(p.author)+'</span>'
        + '<span class="when">'+timeAgo(p.published_at)+'</span>'
        + (p.status === 'draft' ? '<span class="draft-tag">Draft</span>' : '')
        + ownerControlsHtml()
      + '</div>'
      + '<div class="caption">'+escapeHtml(p.caption)+'</div>'
      + galleryHtml(data.assets)
      + reactBarHtml(p.id, data.reactions)
      + '<div class="comments">'
        + '<div class="dash-title">Comments</div>'
        + commentsHtml
        + '<form id="commentForm">'
          + '<div class="row"><input type="text" id="cName" placeholder="Your name" maxlength="60" required/></div>'
          + '<textarea id="cBody" placeholder="Say something…" maxlength="2000" required></textarea>'
          + '<div><button class="btn" type="submit">Post comment</button></div>'
          + '<div class="err" id="cErr" hidden></div>'
        + '</form>'
      + '</div>'
    + '</article>';

  mainEl.querySelector('[data-back]').addEventListener('click', (e)=>{e.preventDefault();navigate('/');});
  const article = mainEl.querySelector('article');
  initCarousel(article.querySelector('.carousel'), false);
  wireReactButtons(article);
  wireOwnerControls(article, data.assets);

  document.getElementById('commentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cName').value.trim();
    const body = document.getElementById('cBody').value.trim();
    const errEl = document.getElementById('cErr');
    errEl.hidden = true;
    if (!name || !body) return;
    const res = await addComment(p.id, name, body);
    if (!res){ errEl.textContent = 'Could not post comment — try again shortly.'; errEl.hidden = false; return; }
    viewSinglePost(slug);
  });
}

/* ── sign in ─────────────────────────────────────────────────────────── */
function viewSignIn(){
  mainEl.innerHTML =
    '<div class="box" id="authPanel">'
    + '<div class="dash-title">Sign in</div>'
    + '<form id="signInForm">'
      + '<input type="email" id="siEmail" placeholder="Email" required/>'
      + '<input type="password" id="siPass" placeholder="Password" required/>'
      + '<div><button class="btn" type="submit">Sign in</button></div>'
      + '<div class="err" id="siErr" hidden></div>'
    + '</form>'
  + '</div>';
  document.getElementById('signInForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('siEmail').value.trim();
    const pass  = document.getElementById('siPass').value;
    const errEl = document.getElementById('siErr');
    errEl.hidden = true;
    const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
    if (error){ errEl.textContent = error.message; errEl.hidden = false; return; }
    session = data.session;
    await refreshAuthorStatus();
    if (!isAuthor){
      await supa.auth.signOut();
      session = null;
      errEl.textContent = 'Signed in, but this account is not an author on this site.';
      errEl.hidden = false;
      paintAuthUI();
      return;
    }
    paintAuthUI();
    toast('Signed in as ' + session.user.email);
    navigate('/');
  });
}

/* ── composer ────────────────────────────────────────────────────────── */
let composerAssets = []; // { kind, url, alt, uploading }

function assetThumbHtml(a, idx){
  let inner;
  if (a.kind === 'photo') inner = '<img src="'+escapeHtml(a.url)+'"/>';
  else if (a.kind === 'video') inner = '<video src="'+escapeHtml(a.url)+'" muted></video>';
  else inner = '<div class="fb">FB Reel</div>';
  return '<div class="asset-thumb" data-idx="'+idx+'">' + inner
    + (a.uploading ? '<div class="uploading">uploading…</div>' : '')
    + '<button class="rm" type="button" data-rm="'+idx+'" title="Remove">&times;</button>'
  + '</div>';
}
function paintAssetList(){
  const el = document.getElementById('assetList');
  if (!el) return;
  el.innerHTML = composerAssets.map(assetThumbHtml).join('');
  el.querySelectorAll('[data-rm]').forEach(btn => {
    btn.addEventListener('click', () => {
      composerAssets.splice(Number(btn.dataset.rm), 1);
      paintAssetList();
    });
  });
}

async function uploadFile(file, prefix){
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = (prefix || 'composer') + '/' + uuid() + '.' + ext;
  const { error } = await supa.storage.from(MEDIA_BUCKET).upload(path, file, {
    contentType: file.type, upsert: false
  });
  if (error) throw error;
  const { data } = supa.storage.from(MEDIA_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function viewComposer(){
  composerAssets = [];
  mainEl.innerHTML =
    '<div class="box" id="composer">'
    + '<div class="dash-title">New post</div>'
    + '<div class="field">'
      + '<label>Posting as</label>'
      + '<input type="text" id="cpAuthor" value="STO Supply Co"/>'
    + '</div>'
    + '<div class="field">'
      + '<label>Caption</label>'
      + '<textarea id="cpCaption" placeholder="What\'s going on…" maxlength="2000"></textarea>'
    + '</div>'
    + '<div class="field">'
      + '<label>Photos / videos</label>'
      + '<input type="file" id="cpFiles" accept="image/*,video/*" multiple/>'
      + '<div id="assetList"></div>'
    + '</div>'
    + '<div class="field">'
      + '<label>Facebook Reel link</label>'
      + '<div style="display:flex;gap:6px">'
        + '<input type="text" id="cpFbUrl" placeholder="https://www.facebook.com/reel/…"/>'
        + '<button class="btn ghost" type="button" id="cpFbAdd">Add</button>'
      + '</div>'
    + '</div>'
    + '<div class="actions">'
      + '<button class="btn ghost" id="cpDraft">Save as draft</button>'
      + '<button class="btn" id="cpPublish">Publish</button>'
      + '<span class="hint" id="cpStatus"></span>'
    + '</div>'
    + '<div class="err" id="cpErr" hidden></div>'
  + '</div>';

  document.getElementById('cpFiles').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const file of files){
      const kind = file.type.startsWith('video') ? 'video' : 'photo';
      const localUrl = URL.createObjectURL(file);
      const entry = { kind, url: localUrl, alt: '', uploading: true };
      composerAssets.push(entry);
      paintAssetList();
      try {
        const publicUrl = await uploadFile(file);
        entry.url = publicUrl;
        entry.uploading = false;
      } catch (err){
        toast('Upload failed: ' + err.message);
        composerAssets.splice(composerAssets.indexOf(entry), 1);
      }
      paintAssetList();
    }
  });

  document.getElementById('cpFbAdd').addEventListener('click', () => {
    const input = document.getElementById('cpFbUrl');
    const url = input.value.trim();
    if (!url) return;
    composerAssets.push({ kind: 'facebook_embed', url, alt: '', uploading: false });
    input.value = '';
    paintAssetList();
  });

  async function submit(status){
    const errEl = document.getElementById('cpErr');
    const statusEl = document.getElementById('cpStatus');
    errEl.hidden = true;
    const caption = document.getElementById('cpCaption').value.trim();
    const author  = document.getElementById('cpAuthor').value.trim() || 'STO Supply Co';
    if (!caption && composerAssets.length === 0){
      errEl.textContent = 'Add a caption or at least one photo/video.';
      errEl.hidden = false;
      return;
    }
    if (composerAssets.some(a => a.uploading)){
      errEl.textContent = 'Still uploading — wait for it to finish.';
      errEl.hidden = false;
      return;
    }
    statusEl.textContent = 'Saving…';
    const { data: post, error } = await supa.from('posts')
      .insert({ caption, author, status })
      .select().single();
    if (error){
      statusEl.textContent = '';
      errEl.textContent = error.message;
      errEl.hidden = false;
      return;
    }
    if (composerAssets.length){
      const rows = composerAssets.map((a, idx) => ({
        post_id: post.id, kind: a.kind, url: a.url, alt: a.alt || null, position: idx
      }));
      const { error: aErr } = await supa.from('post_assets').insert(rows);
      if (aErr){
        statusEl.textContent = '';
        errEl.textContent = 'Post saved, but gallery failed: ' + aErr.message;
        errEl.hidden = false;
        return;
      }
    }
    statusEl.textContent = '';
    toast(status === 'draft' ? 'Draft saved' : 'Published');
    navigate('/p/' + post.slug);
  }
  document.getElementById('cpDraft').addEventListener('click', () => submit('draft'));
  document.getElementById('cpPublish').addEventListener('click', () => submit('published'));
}

/* ── profile image editor ────────────────────────────────────────────── */
// Edits a working copy; nothing reaches the site until Save. Files upload as
// they are picked, so Save only ever writes URLs that already exist.
function viewProfileEdit(){
  let items = profileMedia.map(m => Object.assign({}, m));

  mainEl.innerHTML =
    '<div class="box" id="profileEdit">'
    + '<div class="dash-title" style="margin-top:0">Profile carousel</div>'
    + '<p class="hint">These are the images beside the logo. Drag order is set with the arrows; '
      + 'the carousel rotates every 4 seconds.</p>'
    + '<div class="field" style="margin-top:10px">'
      + '<input type="file" id="peFiles" accept="image/*,video/*" multiple/>'
      + '<div class="slots" id="peSlots"></div>'
    + '</div>'
    + '<div class="actions" style="display:flex;gap:8px;align-items:center;margin-top:14px">'
      + '<button class="btn ghost" id="peReset">Reset to default</button>'
      + '<button class="btn" id="peSave">Save</button>'
      + '<span class="hint" id="peStatus"></span>'
    + '</div>'
    + '<div class="err" id="peErr" hidden></div>'
  + '</div>';

  function paint(){
    const el = document.getElementById('peSlots');
    el.innerHTML = items.map((m, idx) =>
      '<div class="slot">'
      + (m.kind === 'video' ? '<video src="'+escapeHtml(m.url)+'" muted></video>'
                            : '<img src="'+escapeHtml(m.url)+'"/>')
      + (m.uploading ? '<div class="uploading">uploading…</div>' : '')
      + '<button class="rm" data-rm="'+idx+'" title="Remove">&times;</button>'
      + (idx > 0 ? '<button class="mv l" data-mv="'+idx+'" data-dir="-1" title="Move left">&#8249;</button>' : '')
      + (idx < items.length - 1 ? '<button class="mv r" data-mv="'+idx+'" data-dir="1" title="Move right">&#8250;</button>' : '')
      + '</div>').join('') || '<div class="hint">No images — the default pair will be shown.</div>';

    el.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
      items.splice(Number(b.dataset.rm), 1); paint();
    }));
    el.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.mv), j = i + Number(b.dataset.dir);
      if (j < 0 || j >= items.length) return;
      const t = items[i]; items[i] = items[j]; items[j] = t;
      paint();
    }));
  }
  paint();

  document.getElementById('peFiles').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const file of files){
      const kind = file.type.startsWith('video') ? 'video' : 'photo';
      const entry = { kind, url: URL.createObjectURL(file), alt: '', uploading: true };
      items.push(entry); paint();
      try {
        entry.url = await uploadFile(file, 'profile');
        entry.uploading = false;
      } catch (err){
        toast('Upload failed: ' + err.message);
        items.splice(items.indexOf(entry), 1);
      }
      paint();
    }
  });

  document.getElementById('peSave').addEventListener('click', async () => {
    const errEl = document.getElementById('peErr');
    const statusEl = document.getElementById('peStatus');
    errEl.hidden = true;
    if (items.some(m => m.uploading)){
      errEl.textContent = 'Still uploading — wait for it to finish.';
      errEl.hidden = false;
      return;
    }
    statusEl.textContent = 'Saving…';
    const clean = items.map(m => ({ kind: m.kind, url: m.url, alt: m.alt || '' }));
    const ok = await saveProfileMedia(clean);
    statusEl.textContent = '';
    if (ok){ toast('Profile images updated'); navigate('/'); }
  });

  document.getElementById('peReset').addEventListener('click', async () => {
    const ok = await confirmDialog('Reset profile images?',
      'The carousel goes back to the two images shipped with the site.', 'Reset');
    if (!ok) return;
    items = DEFAULT_PROFILE_MEDIA.map(m => Object.assign({}, m));
    paint();
  });
}

/* ── dashboard ───────────────────────────────────────────────────────── */
async function viewDashboard(){
  mainEl.innerHTML = '<div class="box empty">Loading…</div>';
  const { data, error } = await supa.rpc('analytics', { p_days: 30 });
  if (error){
    mainEl.innerHTML = '<div class="box empty">Could not load analytics: '+escapeHtml(error.message)+'</div>';
    return;
  }
  const t = data.totals || {};
  const stats = [
    ['Views', t.views||0], ['Viewers', t.viewers||0], ['Shares', t.shares||0]
  ].map(([l,n]) => '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');

  const postsRows = (data.posts||[]).map(p =>
    '<tr><td>'+escapeHtml(p.caption||'').slice(0,40)+(p.status==='draft'?' (draft)':'')+'</td>'
    + '<td>'+p.views+'</td><td>'+p.comments+'</td><td>'+p.reactions+'</td></tr>'
  ).join('') || '<tr><td colspan="4">No posts yet</td></tr>';

  const dailyRows = (data.daily||[]).slice(-14).map(d =>
    '<tr><td>'+d.day+'</td><td>'+d.views+'</td></tr>'
  ).join('') || '<tr><td colspan="2">No data yet</td></tr>';

  const recentRows = (data.recent_comments||[]).map(c =>
    '<tr><td>'+escapeHtml(c.name)+'</td><td>'+escapeHtml(c.body).slice(0,60)+'</td>'
    + '<td>'+escapeHtml(c.caption||'').slice(0,30)+'</td><td>'+timeAgo(c.created_at)+'</td></tr>'
  ).join('') || '<tr><td colspan="4">No comments yet</td></tr>';

  mainEl.innerHTML =
    '<div class="box" id="dashboard">'
    + '<div class="dash-title" style="margin-top:0">Last 30 days</div>'
    + '<div class="stat-row">' + stats + '</div>'
    + '<div class="dash-title">Views per day</div>'
    + '<table class="data"><thead><tr><th>Day</th><th>Views</th></tr></thead><tbody>'+dailyRows+'</tbody></table>'
    + '<div class="dash-title">Posts</div>'
    + '<table class="data"><thead><tr><th>Caption</th><th>Views</th><th>Comments</th><th>Reactions</th></tr></thead>'
      + '<tbody>'+postsRows+'</tbody></table>'
    + '<div class="dash-title">Recent comments</div>'
    + '<table class="data"><thead><tr><th>Name</th><th>Comment</th><th>Post</th><th>When</th></tr></thead>'
      + '<tbody>'+recentRows+'</tbody></table>'
  + '</div>';
}

/* ── router ──────────────────────────────────────────────────────────── */
function navigate(path){
  if (location.pathname !== path) history.pushState({}, '', path);
  route();
}
function route(){
  const path = location.pathname;
  if (path === '/' || path === '/index.html') { viewFeed(); return; }
  if (path === '/signin') { viewSignIn(); return; }
  if (path === '/compose') {
    if (!isAuthor){ navigate('/signin'); return; }
    viewComposer(); return;
  }
  if (path === '/dashboard') {
    if (!isAuthor){ navigate('/signin'); return; }
    viewDashboard(); return;
  }
  if (path === '/profile-images') {
    if (!isAuthor){ navigate('/signin'); return; }
    viewProfileEdit(); return;
  }
  const m = path.match(/^\/p\/([^/]+)$/);
  if (m) { viewSinglePost(decodeURIComponent(m[1])); return; }
  viewFeed();
}
window.addEventListener('popstate', route);

/* ── boot ────────────────────────────────────────────────────────────── */
(async function boot(){
  // restore a hard-loaded deep link stashed by 404.html
  try {
    const stashed = sessionStorage.getItem('sto_redirect');
    if (stashed){
      sessionStorage.removeItem('sto_redirect');
      history.replaceState({}, '', stashed);
    }
  } catch(e){}

  await checkSession();
  loadProfileMedia();          // not awaited: the shipped slides are already up
  supa.auth.onAuthStateChange(async (_event, sess) => {
    session = sess;
    await refreshAuthorStatus();
    paintAuthUI();
  });
  route();
})();

})();
</script>
